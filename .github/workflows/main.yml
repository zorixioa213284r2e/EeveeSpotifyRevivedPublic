#!/usr/bin/env bash
# Запускать из корня локального клона репозитория.
# Делает: 1) чинит .gitmodules и убирает битый сабмодуль,
#         2) удаляет лишний build-deb-ipa.yml, если он был создан,
#         3) переписывает .github/workflows/main.yml,
#         4) делает один коммит и пуш.
set -euo pipefail

SUB_PATH="Tools/SwiftProtobufBuild"
WF_PATH=".github/workflows/main.yml"
EXTRA_WF=".github/workflows/build-deb-ipa.yml"

# ─── 1. Чиним .gitmodules ────────────────────────────────────────────
if [ -f .gitmodules ] && git config -f .gitmodules --get "submodule.${SUB_PATH}.path" >/dev/null 2>&1; then
  git config -f .gitmodules --remove-section "submodule.${SUB_PATH}"
  echo "Запись сабмодуля удалена из .gitmodules"
fi
if [ -f .gitmodules ] && [ ! -s .gitmodules ]; then
  git rm -q -f .gitmodules 2>/dev/null || rm -f .gitmodules
  echo ".gitmodules пуст и удалён"
fi

# ─── 2. Убираем gitlink (сабмодуль) из индекса, файлы оставляем ──────
if git ls-tree HEAD "$SUB_PATH" 2>/dev/null | grep -q '^160000'; then
  git rm -q --cached "$SUB_PATH"
  echo "Gitlink $SUB_PATH убран из индекса"
fi
if [ -e "$SUB_PATH/.git" ]; then
  rm -rf "$SUB_PATH/.git"
fi
if [ -d "$SUB_PATH" ]; then
  git add -A "$SUB_PATH"
fi

# ─── 3. Удаляем лишний workflow, если он был создан раньше ───────────
if [ -f "$EXTRA_WF" ]; then
  git rm -q -f "$EXTRA_WF" 2>/dev/null || rm -f "$EXTRA_WF"
  echo "Удалён лишний файл $EXTRA_WF"
fi

# ─── 4. Записываем исправленный main.yml ─────────────────────────────
mkdir -p "$(dirname "$WF_PATH")"
cat > "$WF_PATH" <<'EOF'
name: Build rootless deb and inject into IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Ветка для сборки"
        default: "main"
        required: true
        type: string
      ipa_url:
        description: "URL расшифрованного Spotify IPA (необязательно; если пусто — сборка IPA пропускается)"
        default: ""
        required: false
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: false
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Checkout Azule
        uses: actions/checkout@v4
        with:
          repository: Al4ise/Azule
          path: Azule-src

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          chmod +x "$GITHUB_WORKSPACE/Azule-src/azule"
          sudo ln -sf "$GITHUB_WORKSPACE/Azule-src/azule" /usr/local/bin/azule

      - name: Build EeveeSwiftProtobuf.framework
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          make spm

          SCRIPT=$(find . \( -path ./theos -o -path ./Azule-src \) -prune -o \
                   -name 'build-eeveeswiftprotobuf.sh' -print | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::build-eeveeswiftprotobuf.sh не найден"
            exit 1
          fi
          chmod +x "$SCRIPT"
          xcrun --sdk iphoneos "$SCRIPT"

      - name: Build .deb (rootless)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1

          DEB_PATH=$(find packages -name 'com.eevee.spotify_*.deb' | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::.deb не собран"
            exit 1
          fi
          echo "DEB_PATH=$GITHUB_WORKSPACE/$DEB_PATH" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> "$GITHUB_ENV"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # ─── IPA (только если передан ipa_url) ───────────────────────────

      - name: Download and validate IPA
        if: ${{ inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/spotify.ipa"
          wget --no-verbose -O "$IPA" "$IPA_URL"

          unzip -l "$IPA" | awk '{print $NF}' > "$RUNNER_TEMP/ipa-files.txt"
          if ! grep -Eq '^Payload/[^/]+\.app/Info\.plist$' "$RUNNER_TEMP/ipa-files.txt"; then
            echo "::error::Файл не похож на IPA (нет Payload/*.app/Info.plist)"
            exit 1
          fi

      - name: Build zxPluginsInject.dylib (optional)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          SCRIPT=$(find . \( -path ./theos -o -path ./Azule-src \) -prune -o \
                   -name 'build-zxpi.sh' -print | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "::warning::build-zxpi.sh не найден, zxPluginsInject пропущен"
            exit 0
          fi
          (cd "$(dirname "$SCRIPT")" && bash "$(basename "$SCRIPT")")

          ZX=$(find . \( -path ./theos -o -path ./Azule-src \) -prune -o \
               -name 'zxPluginsInject.dylib' -print | head -n 1)
          if [ -n "$ZX" ]; then
            echo "ZX_DYLIB=$GITHUB_WORKSPACE/${ZX#./}" >> "$GITHUB_ENV"
          else
            echo "::warning::zxPluginsInject.dylib не собран, он не будет внедрён"
          fi

      - name: Inject deb + frameworks into IPA (Azule)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          IPA="$GITHUB_WORKSPACE/spotify.ipa"

          EXTRACT="$RUNNER_TEMP/deb-extract"
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$EXTRACT"

          DYLIB=$(find "$EXTRACT" -name 'EeveeSpotify.dylib' | head -n 1)
          BUNDLE=$(find "$EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -n 1)
          FRAMEWORK=$(find "$EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "::error::EeveeSpotify.dylib не найден в .deb"
            exit 1
          fi

          INJECT=("$DYLIB")
          if [ -n "$BUNDLE" ]; then INJECT+=("$BUNDLE"); fi
          if [ -n "$FRAMEWORK" ]; then INJECT+=("$FRAMEWORK"); fi
          if [ -n "${ZX_DYLIB:-}" ]; then INJECT+=("$ZX_DYLIB"); fi

          SPOT_VERSION=$(unzip -p "$IPA" 'Payload/Spotify.app/Info.plist' \
                         | plutil -extract CFBundleShortVersionString raw - 2>/dev/null \
                         || echo "unknown")
          EEVEE_VERSION=$(awk '/^Version:/ {print $2; exit}' control)

          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}.ipa"
          mkdir -p Outputs/IPAS
          rm -f "$OUT"

          azule -i "$IPA" -o "$OUT" -f "${INJECT[@]}"
          echo "OUT_IPA=$GITHUB_WORKSPACE/$OUT" >> "$GITHUB_ENV"

      - name: Remove Watch app from IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail
          unzip -l "$OUT_IPA" | awk '{print $NF}' > "$RUNNER_TEMP/ipa-files.txt"

          if grep -q '^Payload/Spotify\.app/Watch/' "$RUNNER_TEMP/ipa-files.txt"; then
            zip -qd "$OUT_IPA" 'Payload/Spotify.app/Watch/*'
            echo "Watch app removed"
          else
            echo "Watch app not found, nothing to remove"
          fi

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
EOF
echo "Workflow записан: $WF_PATH"

# ─── 5. Коммит и пуш ─────────────────────────────────────────────────
git add -A .gitmodules 2>/dev/null || true
git add -A "$WF_PATH"
git add -A "$EXTRA_WF" 2>/dev/null || true

if git diff --cached --quiet; then
  echo "Изменений для коммита нет"
else
  git commit -m "Fix broken submodule and rewrite build workflow"
  git push
  echo "Готово: изменения отправлены. Запустите Actions → Run workflow."
fi
