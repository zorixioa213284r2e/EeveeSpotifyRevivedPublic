name: Build rootless deb and inject into IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Ветка для сборки"
        default: "main"
        required: true
        type: string
      ipa_url:
        description: "URL расшифрованного Spotify IPA (необязательно; если пусто — сборка IPA пропускается)"
        default: ""
        required: false
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: false
          persist-credentials: false

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Checkout Azule
        uses: actions/checkout@v4
        with:
          repository: Al4ise/Azule
          path: Azule-src

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          chmod +x "$GITHUB_WORKSPACE/Azule-src/azule"
          sudo ln -sf "$GITHUB_WORKSPACE/Azule-src/azule" /usr/local/bin/azule

      - name: Build EeveeSwiftProtobuf.framework
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          make spm

          SCRIPT=$(find . \( -path ./theos -o -path ./Azule-src \) -prune -o \
                   -name 'build-eeveeswiftprotobuf.sh' -print | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::build-eeveeswiftprotobuf.sh не найден"
            exit 1
          fi
          chmod +x "$SCRIPT"
          xcrun --sdk iphoneos "$SCRIPT"

      - name: Build .deb (rootless)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1

          DEB_PATH=$(find packages -name 'com.eevee.spotify_*.deb' | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::.deb не собран"
            exit 1
          fi
          echo "DEB_PATH=$GITHUB_WORKSPACE/$DEB_PATH" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> "$GITHUB_ENV"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # ─── IPA (только если передан ipa_url) ───────────────────────────

      - name: Download and validate IPA
        if: ${{ inputs.ipa_url != '' }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/spotify.ipa"
          wget --no-verbose -O "$IPA" "$IPA_URL"

          unzip -l "$IPA" | awk '{print $NF}' > "$RUNNER_TEMP/ipa-files.txt"
          if ! grep -Eq '^Payload/[^/]+\.app/Info\.plist$' "$RUNNER_TEMP/ipa-files.txt"; then
            echo "::error::Файл не похож на IPA (нет Payload/*.app/Info.plist)"
            exit 1
          fi

      - name: Build zxPluginsInject.dylib (optional)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          SCRIPT=$(find . \( -path ./theos -o -path ./Azule-src \) -prune -o \
                   -name 'build-zxpi.sh' -print | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "::warning::build-zxpi.sh не найден, zxPluginsInject пропущен"
            exit 0
          fi
          (cd "$(dirname "$SCRIPT")" && bash "$(basename "$SCRIPT")")

          ZX=$(find . \( -path ./theos -o -path ./Azule-src \) -prune -o \
