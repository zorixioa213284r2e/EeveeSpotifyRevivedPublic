name: Build Rootless Deb and inject .deb into IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "main"
        required: true
        type: string
      ipa_url:
        description: "URL to a decrypted Spotify IPA (optional — IPA build is skipped if empty)"
        default: ""
        required: false
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Setup Theos build suite
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Download Azule tool
        uses: actions/checkout@v4
        with:
          repository: Al4ise/Azule
          path: ${{ github.workspace }}/Azule-src

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          
          chmod +x ${{ github.workspace }}/Azule-src/azule
          sudo ln -sf ${{ github.workspace }}/Azule-src/azule /usr/local/bin/azule
          sudo ln -sf ${{ github.workspace }}/Azule-src/azule /usr/local/bin/cyan || true

      - name: Build EeveeSwiftProtobuf.framework from source
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make spm
          
          # Пытаемся найти локальный скрипт сборщика фреймворка
          SCRIPT_PATH=$(find . -name "build-eeveeswiftprotobuf.sh" | head -1)
          
          # Если его нет (папка пуста), скачиваем оригинальный рабочий скрипт компиляции из апстрима
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Local build script not found. Fetching clean compiler from upstream..."
            mkdir -p Tools/SwiftProtobufBuild
            wget -q "https://githubusercontent.com" -O Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
            SCRIPT_PATH="Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh"
          fi
          
          chmod +x "$SCRIPT_PATH"
          
          # Запускаем сборку фреймворка под целевую архитектуру iOS (iphoneos)
          xcrun --sdk iphoneos "$SCRIPT_PATH" || "$SCRIPT_PATH"

      - name: Build .deb (rootless)
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH"   >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> $GITHUB_ENV

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # ─── IPA build (only when ipa_url is provided) ───────────────────

      - name: Validate vanilla IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Build zxPluginsInject.dylib
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/build-zxpi.sh 2>/dev/null || chmod +x build-zxpi.sh 2>/dev/null || true
          ./Tools/build-zxpi.sh 2>/dev/null || ./build-zxpi.sh 2>/dev/null || true

      - name: Inject deb + framework into IPA (Azule)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \

              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          EEVEE_VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}.ipa"

          INJECT_FILES=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT_FILES+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT_FILES+=("$BUNDLE_SRC")
          
          ZX_DYLIB=$(find . -name "zxPluginsInject.dylib" | head -1)
          [ -n "$ZX_DYLIB" ] && INJECT_FILES+=("$ZX_DYLIB")

          azule -i ${{ github.workspace }}/spotify.ipa -o "$OUT" -f "${INJECT_FILES[@]}"
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: Strip Watch app (if any survived)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
            zip -qry "$(basename "$OUT_IPA")" Payload
          fi
          rm -rf Payload

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error
